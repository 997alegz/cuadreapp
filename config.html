<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#065A60" />
  <title>Cuadre | Configuración Maestra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --box-bg: #F7FBFD;
      --main-bg: #E2EFF3;
      --text-main: #1A2B30;
      --header-bg: #065A60;
      --accent-btn: #087E8B;
      --accent-hover: #066974;
      --accent-warm: #F57C00;
      --border-line: #B8D4DC;
      --positive: #0f766e;
      --negative: #b91c1c;
      --shadow-soft: 0 10px 26px rgba(6, 90, 96, 0.09);
      --shadow-card: 0 6px 18px rgba(26, 43, 48, 0.07);
      --ease-fintech: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--main-bg);
      background-image: radial-gradient(circle at top right, rgba(8, 126, 139, 0.12), transparent 55%),
                        radial-gradient(circle at bottom left, rgba(245, 124, 0, 0.06), transparent 45%);
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      color: var(--text-main);
    }

    .app-shell {
      width: 100%;
      max-width: 480px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: 36px;
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulseShimmer {
      0% { opacity: 0.45; }
      50% { opacity: 0.9; }
      100% { opacity: 0.45; }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .anim-entry { animation: fadeSlideUp 0.45s var(--ease-fintech) both; }

    .skeleton {
      background: linear-gradient(90deg, rgba(8, 126, 139, 0.12) 25%, rgba(8, 126, 139, 0.24) 50%, rgba(8, 126, 139, 0.12) 75%);
      background-size: 200% 100%;
      animation: pulseShimmer 1.35s infinite ease-in-out;
      border-radius: 8px;
      color: transparent !important;
      user-select: none;
    }

    .spinner-sm {
      width: 15px;
      height: 15px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: #ffffff;
      border-radius: 50%;
      display: inline-block;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
    }

    .dark-header {
      background: linear-gradient(155deg, var(--header-bg) 0%, #044348 100%);
      color: #ffffff;
      padding: calc(20px + env(safe-area-inset-top)) 20px 64px;
      border-bottom-left-radius: 28px;
      border-bottom-right-radius: 28px;
      box-shadow: 0 12px 28px rgba(6, 90, 96, 0.18);
    }

    .header-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 8px;
    }

    .header-logo {
      height: 32px;
      width: auto;
      object-fit: contain;
      background-color: var(--box-bg);
      padding: 4px 10px;
      border-radius: 11px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
    }

    .btn-back {
      background-color: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.26);
      padding: 7px 12px;
      border-radius: 11px;
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: transform 0.18s var(--ease-fintech), background-color 0.2s ease;
    }

    .btn-back:hover { transform: translateY(-1px); background-color: rgba(255, 255, 255, 0.22); }
    .btn-back:active { transform: scale(0.96); }

    .page-title { font-size: 1.38rem; font-weight: 700; letter-spacing: -0.3px; }
    .page-sub { font-size: 0.78rem; opacity: 0.84; font-weight: 300; margin-top: 2px; }

    .content-wrapper {
      padding: 0 18px;
      margin-top: -42px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 10;
    }

    .card {
      background-color: var(--box-bg);
      border: 1px solid var(--border-line);
      border-radius: 20px;
      padding: 18px;
      box-shadow: var(--shadow-soft);
      transition: transform 0.22s var(--ease-fintech), box-shadow 0.22s var(--ease-fintech);
    }

    .card-title {
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--header-bg);
      margin-bottom: 12px;
    }

    .form-group { margin-bottom: 12px; }
    .form-label { display: block; font-size: 0.74rem; font-weight: 600; margin-bottom: 5px; opacity: 0.86; }

    .form-input, .form-select {
      width: 100%;
      padding: 11px 13px;
      background-color: #ffffff;
      border: 1.5px solid var(--border-line);
      border-radius: 12px;
      font-size: 0.85rem;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-input:focus, .form-select:focus {
      border-color: var(--accent-btn);
      box-shadow: 0 0 0 3px rgba(8, 126, 139, 0.14);
    }

    .btn-primary {
      width: 100%;
      padding: 13px;
      background-color: var(--accent-btn);
      color: #ffffff;
      border: none;
      border-radius: 13px;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(8, 126, 139, 0.24);
      transition: background-color 0.2s ease, transform 0.18s var(--ease-fintech);
    }

    .btn-primary:hover { background-color: var(--accent-hover); transform: translateY(-1px); }
    .btn-primary:active { transform: scale(0.97); }

    .btn-warm {
      background-color: var(--accent-warm);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.18s var(--ease-fintech), filter 0.2s ease;
    }

    .btn-warm:hover { filter: brightness(0.95); transform: translateY(-1px); }

    .status-msg {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: 600;
      text-align: center;
      display: none;
    }

    .status-msg.show { display: block; animation: fadeSlideUp 0.3s var(--ease-fintech); }
    .status-ok { background-color: #EAF5F6; color: #0D4A50; border: 1px solid #B8DCE0; }
    .status-warn { background-color: #F7F2EA; color: #5C4624; border: 1px solid #E3D5BE; }

    .app-footer {
      margin-top: auto;
      padding-top: 28px;
      text-align: center;
      font-size: 0.72rem;
      font-weight: 500;
      opacity: 0.68;
    }

    .hidden { display: none !important; }
    .add-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .chips-wrap { display: flex; flex-wrap: wrap; gap: 7px; }
    .chip {
      background: #ffffff; border: 1px solid var(--border-line); border-radius: 10px;
      padding: 6px 10px; font-size: 0.76rem; font-weight: 600; display: inline-flex; align-items: center; gap: 8px;
    }
    .chip button {
      border: none; background: rgba(245, 124, 0, 0.14); color: #9a4a00;
      width: 20px; height: 20px; border-radius: 6px; font-weight: 700; cursor: pointer;
    }
  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, updatePassword, updateEmail, reauthenticateWithCredential, EmailAuthProvider } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";
    import { getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc, query, where } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAR6Iy5kKzwjjRv912OgfGJ2anF3S0Ujp0",
      authDomain: "cuadre-33bb7.firebaseapp.com",
      projectId: "cuadre-33bb7",
      storageBucket: "cuadre-33bb7.firebasestorage.app",
      messagingSenderId: "216692071880",
      appId: "1:216692071880:web:011ad59c9311d57eff74fd",
      measurementId: "G-YECRX7JYVT"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const ADMIN_EMAIL = "admin@admin.com";
    const LIST_KEYS = [
      { key: "bancos_ves", title: "Bancos en Bolívares (Bs.)" },
      { key: "bancos_usd", title: "Bancos / plataformas en Dólares ($USD)" },
      { key: "tokens_crypto", title: "Cripto y Tokens" },
      { key: "categorias_ingreso", title: "Categorías de Ingresos" },
      { key: "categorias_gasto", title: "Categorías de Gastos" },
      { key: "marcas_vehiculo", title: "Marca de la nave" },
      { key: "modelos_vehiculo", title: "Modelos de la nave" },
      { key: "colores_vehiculo", title: "Colores de la nave" },
      { key: "anos_vehiculo", title: "Años de la nave" }
    ];
    let masterData = {};

    async function loadMasterLists() {
      const snap = await getDoc(doc(db, "configuracion_maestra", "listas"));
      masterData = snap.exists() ? snap.data() : {};
      renderAllLists();
    }

    function renderAllLists() {
      const container = document.getElementById('lists-container');
      container.innerHTML = LIST_KEYS.map(item => {
        const arr = Array.isArray(masterData[item.key]) ? masterData[item.key] : [];
        const chipsHtml = arr.length === 0
          ? `<span style="font-size:0.75rem; opacity:0.72;">Todavía no hay nada anotado aquí.</span>`
          : arr.map((val, idx) => `<span class="chip">${val} <button type="button" onclick="removeItem('${item.key}', ${idx})">×</button></span>`).join('');
        return `
          <section class="card anim-entry">
            <div class="card-title">${item.title}</div>
            <div class="add-row">
              <input type="text" id="inp-${item.key}" class="form-input" placeholder="Nuevo elemento..." />
              <button type="button" class="btn-warm" onclick="addItem('${item.key}')">+</button>
            </div>
            <div id="msg-${item.key}" class="status-msg" style="margin-bottom:8px;"></div>
            <div class="chips-wrap">${chipsHtml}</div>
          </section>
        `;
      }).join('');
    }

    window.addItem = async function(key) {
      const inp = document.getElementById(`inp-${key}`);
      const val = (inp.value || '').trim();
      if (!val) return;
      const arr = Array.isArray(masterData[key]) ? [...masterData[key]] : [];
      if (arr.some(x => x.toLowerCase() === val.toLowerCase())) {
        const msg = document.getElementById(`msg-${key}`);
        msg.textContent = "Ese ya está anotado en la lista.";
        msg.className = "status-msg show status-warn";
        return;
      }
      arr.push(val);
      masterData[key] = arr;
      await setDoc(doc(db, "configuracion_maestra", "listas"), masterData, { merge: true });
      renderAllLists();
    };

    window.removeItem = async function(key, idx) {
      const arr = Array.isArray(masterData[key]) ? [...masterData[key]] : [];
      arr.splice(idx, 1);
      masterData[key] = arr;
      await setDoc(doc(db, "configuracion_maestra", "listas"), masterData, { merge: true });
      renderAllLists();
    };

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'cuadre.html'; return; }
      if (user.email !== ADMIN_EMAIL) {
        document.getElementById('denied-card').classList.remove('hidden');
        return;
      }
      document.getElementById('lists-container').classList.remove('hidden');
      await loadMasterLists();
    });
  </script>
</head>
<body>
  <main class="app-shell">
    <header class="dark-header anim-entry">
      <div class="header-top-row">
        <img src="logo cuadre.png" alt="cuadre" class="header-logo" />
        <button type="button" class="btn-back" onclick="window.location.href='dashboard.html'">← Volver</button>
      </div>
      <h1 class="page-title">Configuración Maestra</h1>
      <p class="page-sub">Listas globales • cuadre</p>
    </header>

    <div class="content-wrapper">
      <section id="denied-card" class="card hidden">
        <p style="font-size:0.86rem; font-weight:700; text-align:center;">¿Para donde vas? aquí solo entra el admin.</p>
      </section>
      <div id="lists-container" class="hidden" style="display:flex; flex-direction:column; gap:14px;"></div>
    </div>

    <div class="app-footer">cuadre app • finanzas personales</div>
  </main>
</body>
</html>
