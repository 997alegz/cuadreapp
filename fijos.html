<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#065A60" />
  <title>Cuadre | Pagos Fijos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --box-bg: #F7FBFD;
      --main-bg: #E2EFF3;
      --text-main: #1A2B30;
      --header-bg: #065A60;
      --accent-btn: #087E8B;
      --accent-hover: #066974;
      --accent-warm: #F57C00;
      --border-line: #B8D4DC;
      --positive: #0f766e;
      --negative: #b91c1c;
      --shadow-soft: 0 10px 26px rgba(6, 90, 96, 0.09);
      --shadow-card: 0 6px 18px rgba(26, 43, 48, 0.07);
      --ease-fintech: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--main-bg);
      background-image: radial-gradient(circle at top right, rgba(8, 126, 139, 0.12), transparent 55%),
                        radial-gradient(circle at bottom left, rgba(245, 124, 0, 0.06), transparent 45%);
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      color: var(--text-main);
    }

    .app-shell {
      width: 100%;
      max-width: 480px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: 36px;
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulseShimmer {
      0% { opacity: 0.45; }
      50% { opacity: 0.9; }
      100% { opacity: 0.45; }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .anim-entry { animation: fadeSlideUp 0.45s var(--ease-fintech) both; }

    .skeleton {
      background: linear-gradient(90deg, rgba(8, 126, 139, 0.12) 25%, rgba(8, 126, 139, 0.24) 50%, rgba(8, 126, 139, 0.12) 75%);
      background-size: 200% 100%;
      animation: pulseShimmer 1.35s infinite ease-in-out;
      border-radius: 8px;
      color: transparent !important;
      user-select: none;
    }

    .spinner-sm {
      width: 15px;
      height: 15px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: #ffffff;
      border-radius: 50%;
      display: inline-block;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
    }

    .dark-header {
      background: linear-gradient(155deg, var(--header-bg) 0%, #044348 100%);
      color: #ffffff;
      padding: calc(20px + env(safe-area-inset-top)) 20px 64px;
      border-bottom-left-radius: 28px;
      border-bottom-right-radius: 28px;
      box-shadow: 0 12px 28px rgba(6, 90, 96, 0.18);
    }

    .header-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 8px;
    }

    .header-logo {
      height: 32px;
      width: auto;
      object-fit: contain;
      background-color: var(--box-bg);
      padding: 4px 10px;
      border-radius: 11px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
    }

    .btn-back {
      background-color: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.26);
      padding: 7px 12px;
      border-radius: 11px;
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: transform 0.18s var(--ease-fintech), background-color 0.2s ease;
    }

    .btn-back:hover { transform: translateY(-1px); background-color: rgba(255, 255, 255, 0.22); }
    .btn-back:active { transform: scale(0.96); }

    .page-title { font-size: 1.38rem; font-weight: 700; letter-spacing: -0.3px; }
    .page-sub { font-size: 0.78rem; opacity: 0.84; font-weight: 300; margin-top: 2px; }

    .content-wrapper {
      padding: 0 18px;
      margin-top: -42px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 10;
    }

    .card {
      background-color: var(--box-bg);
      border: 1px solid var(--border-line);
      border-radius: 20px;
      padding: 18px;
      box-shadow: var(--shadow-soft);
      transition: transform 0.22s var(--ease-fintech), box-shadow 0.22s var(--ease-fintech);
    }

    .card-title {
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--header-bg);
      margin-bottom: 12px;
    }

    .form-group { margin-bottom: 12px; }
    .form-label { display: block; font-size: 0.74rem; font-weight: 600; margin-bottom: 5px; opacity: 0.86; }

    .form-input, .form-select {
      width: 100%;
      padding: 11px 13px;
      background-color: #ffffff;
      border: 1.5px solid var(--border-line);
      border-radius: 12px;
      font-size: 0.85rem;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-input:focus, .form-select:focus {
      border-color: var(--accent-btn);
      box-shadow: 0 0 0 3px rgba(8, 126, 139, 0.14);
    }

    .btn-primary {
      width: 100%;
      padding: 13px;
      background-color: var(--accent-btn);
      color: #ffffff;
      border: none;
      border-radius: 13px;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(8, 126, 139, 0.24);
      transition: background-color 0.2s ease, transform 0.18s var(--ease-fintech);
    }

    .btn-primary:hover { background-color: var(--accent-hover); transform: translateY(-1px); }
    .btn-primary:active { transform: scale(0.97); }

    .btn-warm {
      background-color: var(--accent-warm);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.18s var(--ease-fintech), filter 0.2s ease;
    }

    .btn-warm:hover { filter: brightness(0.95); transform: translateY(-1px); }

    .status-msg {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: 600;
      text-align: center;
      display: none;
    }

    .status-msg.show { display: block; animation: fadeSlideUp 0.3s var(--ease-fintech); }
    .status-ok { background-color: #EAF5F6; color: #0D4A50; border: 1px solid #B8DCE0; }
    .status-warn { background-color: #F7F2EA; color: #5C4624; border: 1px solid #E3D5BE; }

    .app-footer {
      margin-top: auto;
      padding-top: 28px;
      text-align: center;
      font-size: 0.72rem;
      font-weight: 500;
      opacity: 0.68;
    }

    .hidden { display: none !important; }
    .fix-item {
      background: #ffffff; border: 1px solid var(--border-line); border-radius: 15px;
      padding: 13px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }
    .fix-item h4 { font-size: 0.85rem; font-weight: 700; }
    .fix-item p { font-size: 0.72rem; opacity: 0.76; }
    .btn-pay {
      background: var(--accent-btn); color: #ffffff; border: none; padding: 6px 10px;
      border-radius: 9px; font-size: 0.7rem; font-weight: 700; cursor: pointer;
    }
    .badge-paid {
      background: #EAF5F6; color: #0D4A50; border: 1px solid #B8DCE0;
      padding: 5px 9px; border-radius: 9px; font-size: 0.7rem; font-weight: 700;
    }
  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, updatePassword, updateEmail, reauthenticateWithCredential, EmailAuthProvider } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";
    import { getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc, query, where } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAR6Iy5kKzwjjRv912OgfGJ2anF3S0Ujp0",
      authDomain: "cuadre-33bb7.firebaseapp.com",
      projectId: "cuadre-33bb7",
      storageBucket: "cuadre-33bb7.firebasestorage.app",
      messagingSenderId: "216692071880",
      appId: "1:216692071880:web:011ad59c9311d57eff74fd",
      measurementId: "G-YECRX7JYVT"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const ADMIN_EMAIL = "admin@admin.com";
    let currentUser = null;

    function formatMoney(amount, curr) {
      const num = Number(amount) || 0;
      if (curr === 'USD') return `$ ${num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
      if (curr === 'VES') return `Bs. ${num.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
      return `${num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 4 })} CRIPTO`;
    }

    window.saveFixed = async function(e) {
      e.preventDefault();
      if (!currentUser) return;
      const nombre = document.getElementById('fix-nombre').value.trim();
      const moneda = document.getElementById('fix-moneda').value;
      const monto = parseFloat(document.getElementById('fix-monto').value) || 0;
      const diaCorte = parseInt(document.getElementById('fix-dia').value, 10) || 1;
      const btn = document.getElementById('btn-save-fix');
      btn.innerHTML = `<span class="spinner-sm"></span>`;
      await addDoc(collection(db, "fijos"), { uid: currentUser.uid, nombre, moneda, monto, diaCorte, ultimoPagoMes: "" });
      document.getElementById('fix-nombre').value = '';
      document.getElementById('fix-monto').value = '';
      btn.textContent = 'Guardar pago fijo';
      await loadFixed();
    };

    window.markPaidThisMonth = async function(id) {
      const now = new Date();
      const currentMonthKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
      await updateDoc(doc(db, "fijos", id), { ultimoPagoMes: currentMonthKey });
      await loadFixed();
    };

    async function loadFixed() {
      const listEl = document.getElementById('fix-list');
      listEl.innerHTML = `<div class="fix-item skeleton" style="height:56px;"></div>`;
      const now = new Date();
      const currentMonthKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
      const snap = await getDocs(query(collection(db, "fijos"), where("uid", "==", currentUser.uid)));
      const arr = [];
      snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
      if (arr.length === 0) {
        listEl.innerHTML = `<p style="font-size:0.78rem; text-align:center; opacity:0.75;">Todavía no hay fijos anotados aquí.</p>`;
        return;
      }
      listEl.innerHTML = arr.map(f => {
        const isPaid = f.ultimoPagoMes === currentMonthKey;
        return `
          <div class="fix-item anim-entry">
            <div>
              <h4>${f.nombre}</h4>
              <p>Día de corte: ${f.diaCorte} • ${formatMoney(f.monto, f.moneda)}</p>
            </div>
            <div>
              ${isPaid
                ? `<span class="badge-paid">Pagado este mes</span>`
                : `<button type="button" class="btn-pay" onclick="markPaidThisMonth('${f.id}')">Pagar este mes</button>`}
            </div>
          </div>
        `;
      }).join('');
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'cuadre.html'; return; }
      currentUser = user;
      await loadFixed();
    });
  </script>
</head>
<body>
  <main class="app-shell">
    <header class="dark-header anim-entry">
      <div class="header-top-row">
        <img src="logo cuadre.png" alt="cuadre" class="header-logo" />
        <button type="button" class="btn-back" onclick="window.location.href='dashboard.html'">← Volver</button>
      </div>
      <h1 class="page-title">Pagos Fijos</h1>
      <p class="page-sub">Fijos del mes • cuadre</p>
    </header>

    <div class="content-wrapper anim-entry">
      <section class="card">
        <div class="card-title">Agregar pago fijo</div>
        <form onsubmit="saveFixed(event)">
          <div class="form-group">
            <label class="form-label">Servicio o compromiso</label>
            <input type="text" id="fix-nombre" class="form-input" placeholder="Ej. Internet Fibra / Condominio" required />
          </div>
          <div class="form-group">
            <label class="form-label">Moneda</label>
            <select id="fix-moneda" class="form-select">
              <option value="USD">Dólares ($ USD)</option>
              <option value="VES">Bolívares (Bs.)</option>
              <option value="CRYPTO">Cripto / Tokens</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Monto mensual</label>
            <input type="number" step="0.01" id="fix-monto" class="form-input" placeholder="0.00" required />
          </div>
          <div class="form-group">
            <label class="form-label">Día de corte (1 al 31)</label>
            <input type="number" min="1" max="31" id="fix-dia" class="form-input" value="15" required />
          </div>
          <button type="submit" id="btn-save-fix" class="btn-primary">Guardar pago fijo</button>
        </form>
      </section>

      <section class="card">
        <div class="card-title">Fijos del mes</div>
        <div id="fix-list" style="display:flex; flex-direction:column; gap:8px;"></div>
      </section>
    </div>

    <div class="app-footer">cuadre app • finanzas personales</div>
  </main>
</body>
</html>
